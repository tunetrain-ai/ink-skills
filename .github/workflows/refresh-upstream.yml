name: Refresh upstream versions

# Weekly check for whether ink/@inkjs/ui/the ecosystem packages pinned in
# docs/SOURCES.md have moved. Opens a PR when they have — it does not edit
# any skill content itself (see the note in check-upstream-drift.mjs on why:
# API drift needs a human to re-read the actual .d.ts files, not just diff
# version numbers — see docs/SOURCES.md's own note on this).

on:
  schedule:
    - cron: '17 6 * * 1' # Monday 06:17 UTC — an arbitrary off-peak time
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Resolve current upstream versions
        run: npm run fetch-sources

      - name: Compare against docs/SOURCES.md
        id: drift
        run: npm run check-drift

      - name: Open or update PR
        if: steps.drift.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'docs: bump pinned upstream versions in SOURCES.md'
          title: 'upstream: dependency versions have moved'
          body-path: .sources/drift-summary.md
          branch: chore/refresh-upstream
          add-paths: docs/SOURCES.md
          labels: upstream-drift
